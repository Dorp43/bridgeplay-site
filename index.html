<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgePlay — Play Windows Games on Your Mac</title>
    <meta name="description" content="Run your existing Windows games on an Apple Silicon Mac. BridgePlay is a native macOS launcher that sets each game up for you — no dual boot, no virtual machines.">
    <meta name="keywords" content="play Windows games on Mac, Mac gaming, DirectX on Mac, Windows games macOS, BridgePlay, game compatibility Mac, Apple Silicon gaming">
    <!-- Google Search only accepts a favicon whose dimensions are a multiple of
         48px, so these are 96/192/512 rather than the old 16/32/64 set. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
    <!-- iOS paints alpha black, so this one is flattened onto the brand ground. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="canonical" href="https://bridgeplay.app">
    <!-- Static hreflang for the home page, so a crawler that does not execute
         JavaScript still discovers the seven language variants. Once React
         mounts, useDocumentMeta clears and rewrites this whole set for the
         current route — see writeAlternates(). -->
    <link rel="alternate" hreflang="en" href="https://bridgeplay.app/">
    <link rel="alternate" hreflang="es" href="https://bridgeplay.app/es/">
    <link rel="alternate" hreflang="de" href="https://bridgeplay.app/de/">
    <link rel="alternate" hreflang="fr" href="https://bridgeplay.app/fr/">
    <link rel="alternate" hreflang="pt-BR" href="https://bridgeplay.app/pt-BR/">
    <link rel="alternate" hreflang="ja" href="https://bridgeplay.app/ja/">
    <link rel="alternate" hreflang="zh-CN" href="https://bridgeplay.app/zh-CN/">
    <link rel="alternate" hreflang="x-default" href="https://bridgeplay.app/">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://bridgeplay.app/#organization",
        "name": "BridgePlay",
        "url": "https://bridgeplay.app",
        "logo": "https://bridgeplay.app/favicon-512.png"
    }
    </script>
    <!-- The 7-day free trial is stated here, on the application, and NOT inside
         any Offer below. No trial is configured on the Paddle prices (see the
         note at the top of src/components/sections/Pricing.tsx) — every one of
         them charges its full amount immediately — so a trial sentence attached
         to a chargeable Offer is a promise Paddle will not honour, and Google
         can render it as a rich result against a $6.99/mo price. The genuine
         free week is claimed inside the app on first launch, with no card. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "https://bridgeplay.app/#software",
        "name": "BridgePlay",
        "applicationCategory": "GameApplication",
        "applicationSubCategory": "Game launcher",
        "operatingSystem": "macOS 14 (Sonoma) or later, Apple Silicon (M1 or later)",
        "processorRequirements": "Apple Silicon (M1 or later). Intel Macs are not supported.",
        "softwareRequirements": "Rosetta 2",
        "description": "A native macOS launcher for Windows games on Apple Silicon. It brings its own Windows compatibility runtime and runs x86 game binaries through Rosetta 2 — no dual boot and no virtual machine. A free 7-day trial is claimed inside the app on first launch, with no payment method; the paid plans below each charge in full at checkout.",
        "url": "https://bridgeplay.app",
        "downloadUrl": "https://github.com/Dorp43/BridgePlay/releases/latest/download/BridgePlay.dmg",
        "publisher": { "@id": "https://bridgeplay.app/#organization" },
        "isAccessibleForFree": false,
        "image": [
            "https://bridgeplay.app/favicon-512.png",
            "https://bridgeplay.app/og-cover.png"
        ],
        "offers": [
            {
                "@type": "Offer",
                "name": "Monthly",
                "price": "6.99",
                "priceCurrency": "USD",
                "category": "subscription",
                "url": "https://bridgeplay.app/#pricing",
                "availability": "https://schema.org/InStock",
                "description": "Billed 6.99 USD every month."
            },
            {
                "@type": "Offer",
                "name": "Yearly",
                "price": "39.99",
                "priceCurrency": "USD",
                "category": "subscription",
                "url": "https://bridgeplay.app/#pricing",
                "availability": "https://schema.org/InStock",
                "description": "Billed 39.99 USD every 12 months."
            },
            {
                "@type": "Offer",
                "name": "Lifetime",
                "price": "59.99",
                "priceCurrency": "USD",
                "category": "one-time purchase",
                "url": "https://bridgeplay.app/#pricing",
                "availability": "https://schema.org/InStock",
                "description": "One payment of 59.99 USD. All future updates included, nothing recurring."
            }
        ]
    }
    </script>
    <meta property="og:title" content="BridgePlay — Play Windows Games on Your Mac">
    <meta property="og:description" content="Run your existing Windows games on an Apple Silicon Mac. No dual boot, no virtual machines — a native launcher that sets each game up for you.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bridgeplay.app">
    <!-- og-cover.png, not the old og-image.png: the previous card was a
         transparent PNG, so chat apps composited a floating logo onto their own
         background. New filename because scrapers cache aggressively by URL. -->
    <meta property="og:image" content="https://bridgeplay.app/og-cover.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="BridgePlay — Windows games. Your Mac. Shown beside the BridgePlay game library running on macOS.">
    <meta property="og:site_name" content="BridgePlay">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BridgePlay — Play Windows Games on Your Mac">
    <meta name="twitter:description" content="Run your existing Windows games on an Apple Silicon Mac. No dual boot, no virtual machines.">
    <meta name="twitter:image" content="https://bridgeplay.app/og-cover.png">
    <meta name="twitter:image:alt" content="BridgePlay — Windows games. Your Mac. Shown beside the BridgePlay game library running on macOS.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Instrument Sans is the companion face to the Instrument Serif already
         used for --font-display, so the body and the italic display accents come
         from one family. It is a 400-700 variable font: nothing on the site may
         ask for 800/900 or the browser synthesizes a smeared fake bold. -->
    <!-- Pixelify Sans: ONLY for the hero stat headings — the "written by the
         aura" pixel treatment. Everything else stays Instrument. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Boot splash: lives INSIDE #root, so React's first render replaces it
         atomically - no cleanup code, no flash of empty page while the JS
         bundle loads. Styles are inline because global.css hasn't loaded yet
         at this point; they die with the splash. -->
    <div id="root">
        <div class="boot-splash" role="status" aria-label="Loading">
            <style>
                .boot-splash {
                    position: fixed; inset: 0; z-index: 9999;
                    display: flex; align-items: center; justify-content: center;
                    background: #06060b;
                }
                .boot-orb { position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
                .boot-orb img {
                    width: 64px; height: 64px; border-radius: 14px; position: relative; z-index: 2;
                    animation: boot-breathe 1.5s ease-in-out infinite;
                }
                /* Sweeping arc: a conic tail chasing around the logo. */
                .boot-ring {
                    position: absolute; inset: 14px; border-radius: 50%;
                    background: conic-gradient(from 0deg, transparent 0deg 250deg, rgba(124, 192, 255, 0.9) 320deg, rgba(124, 192, 255, 0) 360deg);
                    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
                    mask: radial-gradient(closest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
                    animation: boot-spin 1.4s linear infinite;
                    filter: drop-shadow(0 0 8px rgba(124, 192, 255, 0.6));
                }
                /* Sonar ripples radiating out behind the mark. */
                .boot-ripple {
                    position: absolute; inset: 0; border-radius: 50%;
                    border: 1px solid rgba(124, 192, 255, 0.4);
                    animation: boot-ripple 2.4s ease-out infinite;
                }
                .boot-ripple2 { animation-delay: 1.2s; }
                @keyframes boot-spin { to { transform: rotate(360deg); } }
                @keyframes boot-ripple {
                    0% { transform: scale(0.5); opacity: 0.8; }
                    100% { transform: scale(1.45); opacity: 0; }
                }
                @keyframes boot-breathe {
                    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(124, 192, 255, 0.45)); }
                    50% { transform: scale(0.94); filter: drop-shadow(0 0 6px rgba(124, 192, 255, 0.2)); }
                }
                @media (prefers-reduced-motion: reduce) {
                    .boot-orb img, .boot-ring, .boot-ripple { animation: none; }
                    .boot-ripple { opacity: 0; }
                }
            </style>
            <div class="boot-orb">
                <span class="boot-ripple"></span>
                <span class="boot-ripple boot-ripple2"></span>
                <span class="boot-ring"></span>
                <img src="/favicon-192.png" alt="">
            </div>
        </div>
    </div>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
